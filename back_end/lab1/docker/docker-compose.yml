version: '3.9'

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    image: lab1_django:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: uvicorn lab1.asgi:application --host 0.0.0.0 --port 8000
    volumes:
      - ../:/code
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=lab1.settings